name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Tests (${{ matrix.platform }})
    # GitHub-hosted runners by default. The repository variables CI_RUNNER_LINUX and CI_RUNNER_WINDOWS (a JSON
    # label or label list, e.g. ["self-hosted","Linux"]) move a platform to your own runners; pull requests from
    # forks then skip this job, since they could run any code there.
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      || (!vars.CI_RUNNER_LINUX && !vars.CI_RUNNER_WINDOWS)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ${{ vars.CI_RUNNER_LINUX || '"ubuntu-latest"' }}
          - platform: windows
            runner: ${{ vars.CI_RUNNER_WINDOWS || '"windows-latest"' }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src

      - name: Test
        run: python -m pytest -q
